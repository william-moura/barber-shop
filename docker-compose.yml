services:
  # O contêiner da aplicação Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barbearia_app
    restart: unless-stopped
    working_dir: /var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www
      - /var/www/vendor
    ports:
      - "9000:9000"
    networks:
      - barbearia_network
    depends_on:
      - db

  # O servidor Web Nginx
  nginx:
    image: nginx:alpine
    container_name: barbearia_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - barbearia_network

  # O banco de dados (MySQL 8)
  db:
    image: mysql:8.0
    container_name: barbearia_db
    restart: unless-stopped
    ports:
      - 3308:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: barbearia_db      
      MYSQL_PASSWORD: william
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
      MYSQL_USER: william
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - barbearia_network

networks:
  barbearia_network:
    driver: bridge

volumes:
  db_data:
